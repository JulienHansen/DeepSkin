repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint --fail-under=8 
        language: system
        types: [python]
        require_serial: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.4
    hooks:
      # Run the linter.
      - id: ruff
        types_or: [ python, pyi ]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]