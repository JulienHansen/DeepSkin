name: Pylint coe quality check

on:
  pull_request:
    branches:
      - develop
      - main
  push: 
    branches:
      - develop
      - main

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 'latest'

      - name: Install pylint
        run: pip install pylint

      - name: Run pylint
        run: pylint --fail-under=8.0 $(git ls-files '*.py')
      