name: Pylint code quality check

on: [workflow_call]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pylint
        run: pip install pylint

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r deployment/requirements.txt
          pip install --no-cache-dir -r streamlit/requirements.txt

      - name: Run pylint
        run: pylint --fail-under=8.0 $(git ls-files '*.py')
      