name: Ruff code quality check

on: [workflow_call]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r deployment/requirements.txt
          pip install --no-cache-dir -r streamlit/requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff (without fix)
        run: ruff check . --exit-zero --output-format=github
